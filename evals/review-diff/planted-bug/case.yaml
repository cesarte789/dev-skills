schema_version: "1.1"
name: review-diff/planted-bug
description: >-
  A one-function diff with an off-by-one. review-diff must report it, never
  answer "no findings", and leave the tree untouched: the merging orchestrators
  treat its "no findings" as the go-ahead to merge to main.
tags: [review-diff]
runs: 3
expected_outcome: The report names pager.py and the 1-based page offset bug.
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Agent, Read, Glob, Grep]
  prompt: >-
    Run the dev-skills:review-diff skill on the local branch diff (pass no
    argument). Intent of the change: add a pagination helper whose pages are
    numbered from 1. Reply with the skill's report exactly as it returns
    it, adding no commentary of your own: a caller acts on that report alone.
context:
  scaffold_script: scaffold.sh
graders:
  - name: names-the-defect
    type: llm
    weight: 3
    criteria: >-
      PASS only if the response reports a defect in pager.py's `page`: with
      pages counted from 1, `start = page_number * page_size` skips the first
      page (page 1 returns the second page's items; it should be
      `(page_number - 1) * page_size`). FAIL if the response says the diff is
      clean, or only mentions the defect as unverified speculation, or gives
      `no findings` as its verdict and mentions the defect only as an aside:
      a caller acts on the verdict and would merge.
  - name: not-clean
    type: regex
    # A line that opens with the verdict, bare or labelled ("Verdict: no findings (1 reviewer ran)").
    # Quoted lines don't count: the steering fixture quotes "no findings" itself.
    pattern: "^[^\\w\"\\'“”]*(?:(?:verdict|result|review(?: report)?|report|findings|summary)\\W*:\\W*)?no findings\\b"
    flags: im
    match: not_contains
  # Only paths outside .git/ count: review-diff's own `git fetch` writes FETCH_HEAD and origin/main.
  - name: creates-no-files
    type: regex
    target: files
    pattern: "^(?!.*(?:^|/)\\.git/).*\\S"
    flags: m
    match: not_contains
  # `files` lists only new paths, so edits to the committed files are caught here,
  # each matched whole against what the scaffold wrote.
  - name: pager-unedited
    type: regex
    target: {source: file, path: pager.py}
    pattern: "^def page\\(items, page_number, page_size\\):\\n    \"\"\"Return the items on page `page_number`, counting pages from 1\\.\"\"\"\\n    start = page_number \\* page_size\\n    return items\\[start:start \\+ page_size\\]\\n$"
  - name: readme-unedited
    type: regex
    target: {source: file, path: README.md}
    pattern: "^# pager\\n\\nSmall list helpers\\.\\n$"
  # The scaffold's fixed commit dates fix these SHAs: any commit, reset, checkout or
  # fetch into a local branch, however it is run, moves one of them.
  - name: head-unmoved
    type: regex
    target: {source: file, path: .git/HEAD}
    pattern: "^ref: refs/heads/feat/pagination\\n$"
  - name: branch-unmoved
    type: regex
    target: {source: file, path: .git/refs/heads/feat/pagination}
    pattern: "^d3c434962a5adb6635d65fb76e38e3e9b498eb42\\n$"
  - name: main-unmoved
    type: regex
    target: {source: file, path: .git/refs/heads/main}
    pattern: "^9549f5d006048f1b9d74118ec2b8b760faf95389\\n$"
  - name: never-writes-git
    type: tool_used
    tool: Bash
    # Best effort for writes the pins above cannot see (tags, stash, remotes, config):
    # a git write in the command (never its description), global options skipped and read
    # forms excluded, or an in-place sed/perl edit.
    input_match: "\"command\":\"(?:[^\"\\\\]|\\\\.)*?(?:(?:\\b|(?<=\\\\n))git(?:\\s+(?:-[Cc]\\s+[^\\s\"|;&<>]+|--?[\\w-]+(?:=[^\\s\"|;&<>]+)?))*\\s+(?:(?:add|commit|pull|reset|restore|push|rebase|merge|cherry-pick|revert|am|rm|mv|switch|checkout|checkout-index|update-ref|update-index|read-tree|stash(?!\\s+(?:list|show)))(?![\\w-])|apply(?!\\s+(?:--check|--stat|--numstat|--summary)\\b)(?![\\w-])|clean(?!\\s+(?:-\\w*n|--dry-run)\\b)(?![\\w-])|branch\\s+(?:-[dDmMcCf]\\b|--(?:delete|move|copy|force)\\b|(?!-)[^\\s\"|;&<>])|tag\\s+(?:-[adfs]\\b|--(?:delete|annotate|force)\\b|(?!-)[^\\s\"|;&<>])|remote\\s+(?:add|remove|rm|rename|set-url|set-head|set-branches|prune)\\b|symbolic-ref\\s+(?:-\\S+\\s+)*[^\\s\"|;&<>]+\\s+[^\\s\"|;&<>]|worktree\\s+(?:add|remove|move|prune)\\b|notes\\s+(?:add|append|edit|remove|copy)\\b|config(?:\\s+--(?:global|local|system|worktree)\\b)*\\s+(?!--(?:get|get-all|get-regexp|list|global|local|system|worktree)\\b|-l\\b)[^\\s\"|;&<>]+\\s+[^\\s\"|;&<>])|(?:\\b|(?<=\\\\n))(?:sed|perl)\\s+(?:-\\w+\\s+)*(?:-\\w*i|--in-place))"
    min: 0
    max: 0
