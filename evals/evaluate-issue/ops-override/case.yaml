schema_version: "1.1"
name: evaluate-issue/ops-override
description: >-
  A repo whose dev-skills-ops skill maps every operation evaluate-issue uses to
  local files. evaluate-issue must read the issue, search and post its verdict
  through those entries, never through gh, and leave the issue untouched.
tags: [evaluate-issue, ops-override]
runs: 3
expected_outcome: verdict.md holds a build, narrow or decline verdict on the --json flag.
execution:
  max_turns: 40
  timeout_seconds: 900
  # No Bash: gh cannot run, so only the override's entries can succeed.
  allowed_tools: [Skill, Read, Write, Glob, Grep]
  prompt: >-
    Run the dev-skills:evaluate-issue skill on issue 1. Reply with the skill's
    report exactly as it returns it.
context:
  scaffold_script: scaffold.sh
graders:
  - name: verdict-via-override
    type: regex
    target: {source: file, path: verdict.md}
    pattern: "(?i)\\b(build|narrow|decline)\\b"
  - name: issue-unedited
    type: regex
    target: {source: file, path: issue.md}
    pattern: "^# Add a --json flag to `todo.py list`\\n\\n`todo.py list` prints one task per line\\. Add `--json` so scripts can read the\\nlist as a JSON array of `\\{\"id\", \"title\", \"done\"\\}` objects\\.\\n$"
  - name: report-on-the-issue
    type: llm
    weight: 2
    criteria: >-
      PASS only if the response gives a build, narrow or decline verdict on
      adding a --json flag to `todo.py list`, and says nothing suggesting it
      could not read the issue or post the verdict. FAIL if it reports an
      operation as unavailable, says gh or GitHub was needed, or judges some
      other issue.
